---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # Need full history for version calculation

      - name: Set up mise
        uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204  # v4.2.2

      - name: Typecheck TUI
        run: mise run typecheck:tui

      - name: Build Go app and TUI
        run: |
          # Fix git ownership for VCS stamping
          git config --global --add safe.directory "$(pwd)"

          mise run build:all
